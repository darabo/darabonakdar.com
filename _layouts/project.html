---
layout: default
---
<section class="page-hero">
  <div class="container narrow">
    <p class="page-kicker">{{ page.type }}</p>
    <h1>{{ page.title }}</h1>
    <p class="page-subtitle">{{ page.date }}</p>
  </div>
</section>
<article class="section">
  <div class="container narrow">
    <img class="project-hero-image" src="{{ page.image | prepend: '/assets/images/' | relative_url }}" alt="{{ page.title }}">
    <div class="prose">
      {{ content }}
    </div>
    <nav class="project-pagination" aria-label="Project navigation">
      <a href="{{ '/projects/' | relative_url }}" class="btn btn-ghost">&larr; All projects</a>
    </nav>
  </div>
</article>
