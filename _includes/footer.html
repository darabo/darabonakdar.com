<!--
  The footer shown at the bottom of every page.
  Contact details and social usernames come from _config.yml, so updating
  them there updates the footer automatically.
  The year in the copyright line is kept current by assets/js/main.js
  (look for data-year); the hardcoded number is just a fallback for
  visitors with JavaScript disabled.
-->
<footer class="site-footer">
  <div class="container footer-grid">
    <div>
      <h2 class="footer-heading">Dara Bonakdar</h2>
      <p class="footer-tagline">{{ site.tagline }}</p>
    </div>
    <div>
      <h2 class="footer-heading">Explore</h2>
      <ul class="footer-links">
        <li><a href="{{ '/about/' | relative_url }}">About</a></li>
        <li><a href="{{ '/projects/' | relative_url }}">Projects</a></li>
        <li><a href="{{ '/contact/' | relative_url }}">Contact</a></li>
      </ul>
    </div>
    <div>
      <h2 class="footer-heading">Connect</h2>
      <ul class="footer-links">
        <li><a href="mailto:{{ site.email }}">{{ site.email }}</a></li>
        <li><a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank" rel="noopener">LinkedIn</a></li>
        <li><a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">GitHub</a></li>
      </ul>
      <p class="footer-location">{{ site.location }}</p>
    </div>
  </div>
  <div class="container footer-bottom">
    <p>&copy; <span data-year>2026</span> Dara Bonakdar. All rights reserved.</p>
  </div>
</footer>
