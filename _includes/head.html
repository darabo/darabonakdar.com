<!--
  This file is the <head> of every page — the invisible part of an HTML
  document that holds metadata, fonts and stylesheets. Every layout pulls
  it in with {% raw %}{% include head.html %}{% endraw %}, so a change here
  applies to the whole site.
-->
<head>
  <meta charset="utf-8">
  <!-- Makes the page scale correctly on phones instead of rendering a zoomed-out desktop view -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- The jekyll-seo-tag plugin generates the <title>, description and
       social-media tags from the front matter of each page and _config.yml -->
  {%- seo -%}

  <!-- Pick the image shown when this page is shared on social media:
       project pages use their own thumbnail, everything else uses the
       site-wide default defined as og_image in _config.yml -->
  {%- if page.thumbnail -%}
    {%- assign page_slug = page.path | split: '/' | last | split: '.' | first -%}
    {%- capture share_image -%}/assets/images/projects/{{ page_slug }}/{{ page.thumbnail }}{%- endcapture -%}
  {%- else -%}
    {%- assign share_image = site.og_image -%}
  {%- endif %}
  <meta property="og:image" content="{{ share_image | absolute_url }}">
  <meta name="twitter:image" content="{{ share_image | absolute_url }}">

  <!-- Favicons: the little icons browsers show in tabs and bookmarks -->
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/favicon/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon/favicon-16x16.png' | relative_url }}">
  <link rel="manifest" href="{{ '/favicon/site.webmanifest' | relative_url }}">
  <link rel="mask-icon" href="{{ '/favicon/safari-pinned-tab.svg' | relative_url }}" color="#5bbad5">
  <meta name="theme-color" content="#10151f">

  <!-- Web fonts from Google. "preconnect" opens the network connection early
       so the fonts arrive sooner; "display=swap" shows text in a fallback
       font immediately instead of leaving it invisible while fonts load -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">

  <!-- The single stylesheet for the whole site -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
