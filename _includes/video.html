{%- if include.video.vimeo -%}
<div class="embed-container"><iframe src="https://player.vimeo.com/video/{{ include.video.vimeo }}" title="{{ include.video.title | default: 'Video' }}" allowfullscreen></iframe></div>
{%- elsif include.video.youtube -%}
<div class="embed-container"><iframe src="https://www.youtube.com/embed/{{ include.video.youtube }}?color=white&rel=0" title="{{ include.video.title | default: 'Video' }}" allowfullscreen></iframe></div>
{%- endif -%}
